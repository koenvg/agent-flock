name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: ./.github/actions/verify
        with:
          node-version: 24
      - name: Verify release commit
        run: |
          git fetch --no-tags origin main:refs/remotes/origin/main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" refs/remotes/origin/main; then
            echo "::error::Release tag must point to a commit on main."
            exit 1
          fi
      - name: Verify release version
        run: |
          node <<'NODE'
          const packageVersion = require('./package.json').version;
          const expectedTag = `v${packageVersion}`;
          if (process.env.GITHUB_REF_NAME !== expectedTag) {
            throw new Error(`tag ${process.env.GITHUB_REF_NAME} does not match package version ${packageVersion}`);
          }
          NODE

  build:
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: darwin-arm64
            runner: macos-14
            target: aarch64-apple-darwin
          - id: darwin-x64
            runner: macos-15-intel
            target: x86_64-apple-darwin
          - id: linux-arm64
            runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
          - id: linux-x64
            runner: ubuntu-24.04
            target: x86_64-unknown-linux-musl
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@1d1eb14921d9c2d8ea575663e5fe3a0b57868a05 # 1.89.0
        with:
          targets: ${{ matrix.target }}
      - name: Install musl tools
        if: startsWith(matrix.id, 'linux-')
        run: |
          sudo apt-get update
          sudo apt-get install --yes musl-tools
      - name: Build native binary
        run: cargo build --locked --release --target "${{ matrix.target }}"
      - name: Check native binary
        run: target/${{ matrix.target }}/release/agent-flock --version
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.id }}
          path: target/${{ matrix.target }}/release/agent-flock
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: npm
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - run: npm ci --ignore-scripts
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          path: artifacts
      - name: Assemble npm packages
        run: >-
          node npm/assemble-platform-packages.mjs
          --artifacts artifacts
          --output dist/npm
          --launcher-output dist/launcher
      - name: Verify package contents
        run: |
          for package_dir in ./dist/npm/*; do
            npm pack "$package_dir" --dry-run
          done
          npm pack ./dist/launcher --dry-run
      - name: Publish npm packages
        run: >-
          node npm/publish-packages.mjs
          --platform-packages dist/npm
          --launcher-package dist/launcher
      - name: Prepare GitHub release assets
        run: |
          version=$(node -p "require('./package.json').version")
          mkdir release-assets
          for artifact_dir in artifacts/*; do
            platform=${artifact_dir##*/}
            chmod 0755 "$artifact_dir/agent-flock"
            tar -C "$artifact_dir" -czf "release-assets/agent-flock-${version}-${platform}.tar.gz" agent-flock
          done
          cd release-assets
          sha256sum ./*.tar.gz > SHA256SUMS
      - name: Attest release assets
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: release-assets/*
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(node -p "require('./package.json').version")
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" release-assets/* --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$GITHUB_REF_NAME" release-assets/* \
              --repo "$GITHUB_REPOSITORY" \
              --title "agent-flock ${version}" \
              --generate-notes
          fi
